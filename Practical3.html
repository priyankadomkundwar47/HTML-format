
<!DOCTYPE html>
<html>
<head>
 <title>STUDENT REGISTRATION FORM</title>
</head>
<body style="background-color:#f2f2f2; text-align:center; border:2px solid black; padding:5px">
 <h1>Registration form</h1>
<form>
 <label><b>Full Name :</b></label><br>
 <input type="text" id="name" placeholder="Enter your name"><br><br>

 <label><b>Email :</b></label><br>
 <input type="email" id="email" placeholder="Enter your email"><br><br>

 <label><b>Password :</b></label><br>
 <input type="password" id="Password" placeholder="Enter your password" ><br><br>

 <label><b>Phone Number :</b></label><br>
 <input type="text" id="Phone" placeholder="Enter your phone number"><br><br><br>

<input type="submit" value="Register" style="background-color:green;  color:white">
<input type="reset" value="Reset" style="background-color:red; color:white">

</form>
</body>
</html>
